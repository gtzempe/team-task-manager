spring.application.name=taskmanager

spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager_db
spring.datasource.username=taskmanager_user
spring.datasource.password=taskmanager

spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/team-task-manager

spring.security.oauth2.client.registration.keycloak-service.provider=keycloak-service
spring.security.oauth2.client.registration.keycloak-service.client-id=task-manager-backend
spring.security.oauth2.client.registration.keycloak-service.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak-service.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.keycloak-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak-service.token-uri=http://localhost:8081/realms/team-task-manager/protocol/openid-connect/token